name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Run Linting
        shell: bash
        run: |
          if [ -f "package.json" ]; then
            pnpm install --frozen-lockfile || pnpm install
            pnpm --if-present run lint
            pnpm --if-present run typecheck
          else
            echo "✓ Inception phase: package.json not yet created. Skipping package lint & typecheck."
          fi

  test-workspace:
    name: Test Workspace Packages & Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Run Tests
        shell: bash
        run: |
          if [ -f "package.json" ]; then
            pnpm install --frozen-lockfile || pnpm install
            pnpm --if-present run test
          else
            echo "✓ Inception phase: package.json not yet created. Skipping workspace test suite."
          fi

  secret-scan:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
