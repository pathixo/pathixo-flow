name: Release Drafter & Notes Publisher

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  draft-or-publish-release:
    name: Generate & Publish Release Notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Target
        id: release-meta
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "is_draft=false" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          else
            echo "is_tag=false" >> $GITHUB_OUTPUT
            echo "is_draft=true" >> $GITHUB_OUTPUT
            echo "tag=v2.0.0-draft" >> $GITHUB_OUTPUT
          fi

      - name: Generate Release Notes
        id: release-notes
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.release-meta.outputs.tag }}';
            core.info(`Generating release notes for ${tag}...`);
            
            try {
              const response = await github.rest.repos.generateReleaseNotes({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag
              });
              
              core.setOutput('name', response.data.name || tag);
              core.setOutput('body', response.data.body || 'See CHANGELOG.md for details.');
            } catch (err) {
              core.warning(`Could not auto-generate release notes via API: ${err.message}`);
              core.setOutput('name', tag);
              core.setOutput('body', `Automated release notes for ${tag}. See CHANGELOG.md for details.`);
            }

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-meta.outputs.tag }}
          name: ${{ steps.release-notes.outputs.name }}
          body: ${{ steps.release-notes.outputs.body }}
          draft: ${{ steps.release-meta.outputs.is_draft == 'true' }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
