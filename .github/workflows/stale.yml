name: Stale Issue & PR Hygiene

# Daily hygiene pass: marks inactive issues / PRs as stale, then auto-closes them
# after a grace window. P0, security, bug, enhancement and untriaged items are
# exempt so nothing critical is ever silently auto-closed.

on:
  schedule:
    - cron: '30 3 * * *' # Daily at 03:30 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark Stale & Auto-Close Inactive Items
    runs-on: ubuntu-latest
    steps:
      - name: Mark and close stale items
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # --- Timing policy ---
          days-before-stale: 14
          days-before-close: 7
          operations-per-run: 60

          # --- Labels ---
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'

          # --- Exemptions: never auto-close anything critical or untriaged ---
          exempt-issue-labels: 'P0,security,bug,enhancement,triage'
          exempt-pr-labels: 'security,hold'

          # --- Interaction behavior ---
          remove-stale-when-updated: true
          remove-issue-stale-when-updated: true
          remove-pr-stale-when-updated: true

          # --- Messages ---
          stale-issue-message: |
            This issue has been automatically marked as **stale** because it has had no activity in the last **14 days**.

            It will be closed in **7 days** if nothing further happens. If this issue is still relevant, please:
            - Add a comment explaining current impact or status, **or**
            - Update the issue with recent findings, **or**
            - Remove the `stale` label directly.

            _If it was closed in error, simply reopen it with a short note — nothing is lost._
          close-issue-message: |
            This issue was automatically closed because it had been marked **stale** for **7 days** without activity.

            If you believe this is still relevant, please **reopen with a comment** (or open a new issue referencing this one). If the concern still maps to a planned requirement, cite the requirement ID (e.g. `CORE-007`, `WA-009`) so it links cleanly into `.planning/REQUIREMENTS.md`.
          stale-pr-message: |
            This pull request has been automatically marked as **stale** because it has had no activity in the last **14 days**.

            Please rebase, update, or comment on the next steps for this PR — otherwise it will be closed in **7 days**.
          close-pr-message: |
            This pull request was automatically closed due to inactivity. If you are still working on it, feel free to reopen (the branch and commits remain intact).

          # PRs are never closed automatically by default config choice:
          days-before-pr-close: -1 # Keep PRs open indefinitely; only mark them stale.
