name: PR Labeler

# Two-stage automatic labeling for pull requests:
#
#   Stage 1 (label):          actions/labeler v5 applies path-derived labels
#                             from .github/labeler.yml (additive).
#   Stage 2 (enforce, sync):  a github-script step then
#                             a) enforces EXCLUSIVE label families
#                                (area: backend|frontend|ci|documentation)
#                             b) syncs the PR milestone from the milestone of
#                                the issue the PR closes (Closes #N), applying
#                                the matching exclusive milestone label
#                                (m0..m5) and stripping siblings.
#
# Milestones stay human-assigned on issues; the automation only copies that
# decision onto linking PRs, so labels and burndown views never disagree.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    name: Apply Path Labels
    runs-on: ubuntu-latest
    steps:
      - name: Label from changed paths
        uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

  enforce-and-sync:
    name: Enforce Exclusive Families and Sync Milestone
    needs: label
    runs-on: ubuntu-latest
    steps:
      - name: Finalize exclusivity and milestone sync
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // --------------------------------------------------------------
            // Exclusive label families: at most one surviving label.
            // Order = priority (first match wins when several are present).
            // --------------------------------------------------------------
            const EXCLUSIVE_GROUPS = {
              area: ['backend', 'frontend', 'ci', 'documentation'],
              milestone: ['m0', 'm1', 'm2', 'm3', 'm4', 'm5'],
            };

            const { data: current } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });
            const present = new Set(current.map((l) => l.name));

            const removeLabel = async (name) => {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name,
                });
                core.info(`Removed label '${name}'.`);
              } catch (err) {
                if (err.status !== 404) throw err;
              }
            };

            for (const [family, order] of Object.entries(EXCLUSIVE_GROUPS)) {
              const presentInFamily = order.filter((l) => present.has(l));
              if (presentInFamily.length <= 1) {
                core.info(`Family '${family}': ${presentInFamily.join(', ') || 'none'} (ok).`);
                continue;
              }
              const keep = presentInFamily[0];
              core.warning(`Family '${family}' had ${presentInFamily.length} labels; keeping '${keep}' (priority order).`);
              for (const name of presentInFamily.slice(1)) await removeLabel(name);
            }

            // --------------------------------------------------------------
            // Milestone sync from linked issues.
            // --------------------------------------------------------------
            const body = pr.body || '';
            const linking = [
              ...body.matchAll(
                /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)[\s:]+#(\d+)/gi
              ),
            ];
            if (linking.length === 0) {
              core.info('No closing-keyword references in PR body; milestone not auto-set.');
            }

            let titleToLabel = null;
            let milestoneNumber = null;
            for (const match of linking) {
              const num = Number(match[1]);
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: num,
                });
                if (!issue.milestone) continue;
                titleToLabel = (issue.milestone.title.match(/^\s*M[0-5]/) || [])[0];
                if (!titleToLabel) continue;
                titleToLabel = titleToLabel.toLowerCase();
                milestoneNumber = issue.milestone.number;
                break;
              } catch (err) {
                core.warning(`Could not read issue #${num}: ${err.message}`);
              }
            }

            if (!milestoneNumber) {
              core.info('No linked issue with an M0-M5 milestone; no milestone label applied.');
              return;
            }

            // Apply the milestone label family exclusively, then set the PR
            // milestone itself (write access via the issues API; PRs are issues).
            for (const name of EXCLUSIVE_GROUPS.milestone) {
              if (name !== titleToLabel) await removeLabel(name);
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: [titleToLabel],
            });

            const prMilestone = pr.milestone ? pr.milestone.number : null;
            if (prMilestone !== milestoneNumber) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                milestone: milestoneNumber,
              });
              core.info(`Set PR milestone from linked issue -> number ${milestoneNumber}.`);
            }
            core.info(`Milestone label '${titleToLabel}' ensured.`);
